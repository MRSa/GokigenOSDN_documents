# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

outgoing:
  request_timeout: 18.0

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "xxxxxxxxxxxxxxx"
  image_proxy: true
  limiter: false

search:
  default_lang: "ja-JP"
  formats:
    - html
    - csv
    - json

valkey:
  url: valkey://searxng-valkey:6379/0

engines:
  - name: google
    engine: google
    disabled: true
  - name: bing
    engine: bing
    disabled: true
  - name: brave
    engine: brave
    disabled: true
  - name: brave.images
    engine: brave
    disabled: true
  - name: brave.videos
    engine: brave
    disabled: true
  - name: brave.news
    engine: brave
    disabled: true
  - name: startpage
    engine: startpage
    disabled: true
  - name: baidu
    disabled: true
  - name: ahmia
    engine: ahmia
    disabled: true
  - name: torch
    disabled: true 
  - name: radio browser
    engine: radio_browser
    disabled: true
#  - name: wikidata
#    engine: wikidata
#    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

